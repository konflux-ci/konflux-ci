---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: registry-cert
  namespace: kind-registry
spec:
  isCA: true
  subject:
    organizations:
      - konflux
  dnsNames:
  - localhost
  - registry-service.kind-registry
  # Pinned below konflux-ca renewBefore (4380h); ca.crt is not refreshed when the CA renews.
  duration: 2160h
  renewBefore: 720h
  issuerRef:
    kind: ClusterIssuer
    name: konflux-issuer
  secretName: local-registry-tls
  
