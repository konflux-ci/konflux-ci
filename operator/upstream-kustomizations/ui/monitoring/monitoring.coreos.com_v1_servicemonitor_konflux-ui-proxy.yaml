apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: konflux-ui-proxy
  namespace: konflux-ui
spec:
  endpoints:
  - bearerTokenSecret:
      key: token
      name: prometheus-scrape-token
    interval: 15s
    path: /metrics
    port: metrics
    scheme: https
    tlsConfig:
      # SERVICE_NAME.SERVICE_NAMESPACE.svc substituted by kustomize replacements.
      serverName: SERVICE_NAME.SERVICE_NAMESPACE.svc
      insecureSkipVerify: false
      ca:
        secret:
          name: serving-cert
          key: ca.crt
  selector:
    matchLabels:
      app: proxy
