apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- core
- monitoring
namespace: namespace-lister
images:
- digest: sha256:f637853021f2108a9e9b35a5d700e44ee70ceeb7611420dedbd7329a6d041632
  name: quay.io/konflux-ci/namespace-lister
  newName: quay.io/konflux-ci/namespace-lister
patches:
# Prevent deployment failures during slow dependency setup
- target:
    group: apps
    version: v1
    kind: Deployment
  patch: |-
    - op: add
      path: /spec/progressDeadlineSeconds
      value: 2147483647
replacements:
- source:
    fieldPath: metadata.name
    kind: Service
    name: namespace-lister
  targets:
  - fieldPaths:
    - spec.endpoints.0.tlsConfig.serverName
    options:
      delimiter: '.'
      index: 0
    select:
      group: monitoring.coreos.com
      kind: ServiceMonitor
      name: namespace-lister
      version: v1
- source:
    fieldPath: metadata.namespace
    kind: Service
    name: namespace-lister
  targets:
  - fieldPaths:
    - spec.endpoints.0.tlsConfig.serverName
    options:
      delimiter: '.'
      index: 1
    select:
      group: monitoring.coreos.com
      kind: ServiceMonitor
      name: namespace-lister
      version: v1
