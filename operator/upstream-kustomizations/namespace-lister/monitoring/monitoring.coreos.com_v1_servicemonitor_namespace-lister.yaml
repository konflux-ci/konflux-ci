apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: namespace-lister
  namespace: namespace-lister
spec:
  endpoints:
  - bearerTokenSecret:
      key: token
      name: prometheus-scrape-token
    interval: 15s
    path: /metrics
    port: metrics
    scheme: https
    tlsConfig:
      # SERVICE_NAME.SERVICE_NAMESPACE.svc substituted by kustomize replacements.
      serverName: SERVICE_NAME.SERVICE_NAMESPACE.svc
      insecureSkipVerify: false
      ca:
        secret:
          name: namespace-lister-tls
          key: ca.crt
  selector:
    matchLabels:
      apps: namespace-lister
