# Title: Konflux Release Service Configuration
# Description: KonfluxReleaseService configuration with custom resource limits, environment variables,
# and ReleaseServiceConfig overrides (debug mode, emptyDir pipeline overrides, retryable pipelines).
apiVersion: konflux.konflux-ci.dev/v1alpha1
kind: KonfluxReleaseService
metadata:
  labels:
    app.kubernetes.io/name: konflux-operator
    app.kubernetes.io/managed-by: kustomize
  name: konflux-release-service
spec:
  debug: true
  emptyDirOverrides:
    - url: ".*"
      revision: ".*"
      pathInRepo: "pipelines/managed/fbc-release/fbc-release.yaml"
    - url: ".*"
      revision: ".*"
      pathInRepo: "pipelines/managed/rh-advisories/rh-advisories.yaml"
  retryablePipelines:
    - url: "https://github.com/konflux-ci/release-service-catalog.git"
      revision: ".*"
      pathInRepo: "pipelines/managed/fbc-release/fbc-release.yaml"
      retryPolicy:
        maxRetries: 1
        mitigations:
          oomKill:
            multiplier: "2"
            maxComputeResources:
              limits:
                memory: 8Gi
              requests:
                memory: 8Gi
          timeout:
            pipeline:
              increment: 30m
              maxTimeout: 12h
            task:
              increment: 15m
              maxTimeout: 7h
  releaseControllerManager:
    replicas: 3
    manager:
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 100m
          memory: 256Mi
      env:
        - name: DEFAULT_RELEASE_PVC
          valueFrom:
            configMapKeyRef:
              name: release-service-manager-properties
              key: DEFAULT_RELEASE_PVC
        - name: EXAMPLE_CUSTOM_CONFIG
          valueFrom:
            configMapKeyRef:
              name: release-service-config
              key: custom-config
        - name: EXAMPLE_SECRET_VALUE
          valueFrom:
            secretKeyRef:
              name: release-service-secret
              key: secret-key
