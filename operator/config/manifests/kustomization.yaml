# These resources constitute the fully configured set of manifests
# used to generate the 'manifests/' directory in a bundle.
#
# Compose the same pieces as config/default but without manager-metrics-certs.
# OLM does not support cert-manager CRs; a required metrics-server-cert mount
# would block DeployableByOLM. Kind/local/rings keep verified metrics TLS via
# config/default (which includes the manager-metrics-certs component).
resources:
- bases/konflux-operator.clusterserviceversion.yaml
- ../default/operator-rbac
- ../default/user-rbac
- ../samples
- ../scorecard

# [WEBHOOK] To enable webhooks, uncomment all the sections with [WEBHOOK] prefix.
