apiVersion: v1
data:
  run-dex.sh: "#!/bin/bash\r\n\r\nset -euo pipefail\r\n\r\nORIGINAL_TOKEN=/tmp/var/run/secrets/dex/serviceaccount/token\r\nTOKEN_PATH=${TOKEN_PATH:-/var/run/secrets/kubernetes.io/serviceaccount/token}\r\nWAIT_TIME=10\r\nHALT_TIMEOUT=100\r\nMAX_JITTER_TIME=10\r\n\r\n#
    auxiliary log function\r\nlog() { printf \"%s: %s\\n\" \"$(date -Iseconds)\" \"$*\";
    }\r\n\r\n# forward SIGTERM/SIGINT for graceful shutdown\r\n#\r\n# shellcheck disable=SC2329\r\n#
    ShellCheck is currently bad at figuring out functions that are invoked via trap\r\nshutdown()
    {\r\n  log \"received signal, shutting down\"\r\n  if [ -n \"${dex_pid:-}\" ]
    && [ -d \"/proc/${dex_pid}\" ]; then\r\n    kill -s TERM \"${dex_pid}\" 2>/dev/null
    || true\r\n    wait_for_halt || true\r\n  fi\r\n  exit 143\r\n}\r\n\r\nwait_for_halt()
    (\r\n  counter=0\r\n  while [ -d \"/proc/${dex_pid}\" ] && [ $(( counter++ ))
    -le \"${HALT_TIMEOUT}\" ]; do \r\n    sleep 1\r\n  done\r\n\r\n  if [ -d \"/proc/${dex_pid}\"
    ]; then\r\n    return 1\r\n  fi\r\n  return 0\r\n)\r\n\r\nstart_with_reload()
    {\r\n  while true; do\r\n    # copy the original token for later use\r\n    log
    \"copying the token to ${ORIGINAL_TOKEN}\"\r\n    mkdir -p \"$(dirname \"${ORIGINAL_TOKEN}\")\"\r\n
    \   rm \"${ORIGINAL_TOKEN}\" || true\r\n    cp \"${TOKEN_PATH}\" \"${ORIGINAL_TOKEN}\"\r\n\r\n
    \   # run dex in a subprocess\r\n    OPENSHIFT_OAUTH_CLIENT_SECRET=\"$(cat \"${ORIGINAL_TOKEN}\")\"
    \\\r\n    OPENSHIFT_OAUTH_CLIENT_ID=\"${OPENSHIFT_OAUTH_CLIENT_ID:-system:serviceaccount:${NAMESPACE}:${POD_SERVICE_ACCOUNT}}\"
    \\\r\n      /usr/local/bin/dex serve /etc/dex/cfg/config.yaml &\r\n    dex_pid=\"$!\"\r\n
    \   log \"run Dex in background with pid ${dex_pid}\"\r\n\r\n    # wait for the
    token to be refresh by kubelet\r\n    log \"waiting for the token to be refreshed\"\r\n
    \   while [ \"$(cksum < \"${ORIGINAL_TOKEN}\")\" = \"$(cksum < \"${TOKEN_PATH}\")\"
    ]; do sleep \"${WAIT_TIME}\"; done\r\n\r\n    # reduce likelihood of having all
    replicas refreshing at the same time\r\n    jitter=\"$(( $(od -An -N2 -i /dev/urandom)
    % MAX_JITTER_TIME ))\"\r\n    log \"sleeping ${jitter} seconds to prevent all
    replicas to restart at the same time\"\r\n    sleep \"${jitter}\"\r\n\r\n    #
    Send SIGTERM to Dex\r\n    log \"token refreshed, halting Dex via SIGTERM\"\r\n
    \   if [ -d \"/proc/${dex_pid}\" ]; then\r\n      kill -s TERM \"${dex_pid}\"
    || true\r\n    fi\r\n\r\n    # Wait for Dex to halt\r\n    log \"waiting for Dex
    to gracefully stop\"\r\n    if ! wait_for_halt; then\r\n      log \"Dex didn't
    stop in ${HALT_TIMEOUT} seconds, breaking\"\r\n      exit 1\r\n    fi\r\n  done\r\n\r\n
    \ log \"the loop broke unexpectedly\"\r\n  exit 1\r\n}\r\n\r\nmain() {\r\n  trap
    shutdown TERM INT\r\n\r\n  start_with_reload\r\n}\r\n\r\nmain\r\n"
