apiVersion: v1
kind: Namespace
metadata:
  name: segment-bridge
---
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/name: segment-bridge
  name: segment-bridge
  namespace: segment-bridge
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    app.kubernetes.io/name: segment-bridge
  name: segment-bridge-cursor
  namespace: segment-bridge
rules:
- apiGroups:
  - ""
  resourceNames:
  - segment-bridge-cursor
  resources:
  - configmaps
  verbs:
  - get
  - patch
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: segment-bridge
  name: segment-bridge
rules:
- apiGroups:
  - ""
  resourceNames:
  - kube-system
  resources:
  - namespaces
  verbs:
  - get
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - list
- apiGroups:
  - appstudio.redhat.com
  resources:
  - components
  verbs:
  - list
- apiGroups:
  - appstudio.redhat.com
  resources:
  - applications
  verbs:
  - list
- apiGroups:
  - appstudio.redhat.com
  resources:
  - releases
  verbs:
  - list
- apiGroups:
  - config.openshift.io
  resources:
  - clusterversions
  verbs:
  - get
  - list
- apiGroups:
  - results.tekton.dev
  resources:
  - results
  - records
  verbs:
  - get
  - list
- apiGroups:
  - konflux.konflux-ci.dev
  resources:
  - konfluxes
  verbs:
  - get
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    app.kubernetes.io/name: segment-bridge
  name: segment-bridge-cursor
  namespace: segment-bridge
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: segment-bridge-cursor
subjects:
- kind: ServiceAccount
  name: segment-bridge
  namespace: segment-bridge
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    app.kubernetes.io/name: segment-bridge
  name: segment-bridge
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: segment-bridge
subjects:
- kind: ServiceAccount
  name: segment-bridge
  namespace: segment-bridge
---
apiVersion: v1
kind: ConfigMap
metadata:
  annotations:
    service.beta.openshift.io/inject-cabundle: "true"
  labels:
    app.kubernetes.io/name: segment-bridge
  name: segment-bridge-tekton-results-service-ca
  namespace: segment-bridge
---
apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app.kubernetes.io/name: segment-bridge
  name: segment-bridge
  namespace: segment-bridge
spec:
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - env:
            - name: TEKTON_RESULTS_CA_PATH
              value: /var/run/segment-bridge/tekton-results-ca/service-ca.crt
            envFrom:
            - secretRef:
                name: segment-bridge-config
                optional: true
            image: quay.io/konflux-ci/segment-bridge:f44092eb5d3c6ea5f874721dd77cccbc6453374d
            imagePullPolicy: IfNotPresent
            name: segment-bridge
            resources:
              limits:
                cpu: 200m
                memory: 256Mi
              requests:
                cpu: 50m
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              readOnlyRootFilesystem: true
            volumeMounts:
            - mountPath: /tmp
              name: tmp
            - mountPath: /var/run/segment-bridge/tekton-results-ca
              name: tekton-results-service-ca
              readOnly: true
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          serviceAccountName: segment-bridge
          volumes:
          - emptyDir: {}
            name: tmp
          - configMap:
              items:
              - key: service-ca.crt
                path: service-ca.crt
              name: segment-bridge-tekton-results-service-ca
              optional: true
            name: tekton-results-service-ca
  schedule: 0 * * * *
