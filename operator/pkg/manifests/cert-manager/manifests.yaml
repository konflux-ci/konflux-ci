apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: konflux-ca
  namespace: cert-manager
spec:
  commonName: konflux-ca
  duration: 8760h
  isCA: true
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: konflux-bootstrap-issuer
  privateKey:
    algorithm: ECDSA
    rotationPolicy: Never
    size: 256
  renewBefore: 4380h
  secretName: konflux-ca-secret
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: konflux-issuer
  namespace: cert-manager
spec:
  ca:
    secretName: konflux-ca-secret
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: konflux-bootstrap-issuer
spec:
  selfSigned: {}
---
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: trusted-ca
spec:
  sources:
  - useDefaultCAs: true
  - secret:
      key: ca.crt
      name: konflux-ca-secret
  target:
    configMap:
      key: ca-bundle.crt
    namespaceSelector: {}
