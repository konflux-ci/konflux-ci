codecov:
  require_ci_to_pass: false

ignore:
  - ".agents/**"
  - ".claude/**"
  - ".cursor/**"
  - "skills/**"
  - "operator/docs/**"
  - "*.md"
  - "*.toml"

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
        informational: true
    patch:
      default:
        target: 85%
        informational: false

comment:
  layout: "reach,diff,flags,files,footer"
  require_changes: true
