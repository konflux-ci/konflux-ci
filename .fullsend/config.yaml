# This file is managed by 'fullsend repos': repos-config-v1
# Do not edit this file directly; changes will be overwritten.
version: "1"
tracker:
    github:
        allowed_targets:
            repos:
                - konflux-ci/konflux-ci
                - fullsend-ai/fullsend
roles:
    - fullsend
    - triage
    - coder
    - fix
    - review
    - prioritize
agents:
    - name: review
      trigger: event.transition.kind == "comment_added" && has(event.entity.linked_change_proposal) && has(event.transition.comment.command) && event.transition.comment.command == "/fs-review" && event.actor.kind == "human"
allowed_remote_resources:
    - https://raw.githubusercontent.com/fullsend-ai/fullsend/
    - https://raw.githubusercontent.com/fullsend-ai/agents/
