---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: konflux-bootstrap-issuer
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: konflux-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: konflux-ca
  secretName: konflux-ca-secret
  # Keep the key stable across renewal. cert-manager does not reissue leaves
  # when the CA key changes, and verifiers trust a copied ca.crt. renewBefore
  # is the least life the live CA certificate is allowed to have, and it is
  # longer than the pinned duration of every konflux-issuer certificate (2160h).
  duration: 8760h
  renewBefore: 4380h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Never
  issuerRef:
    name: konflux-bootstrap-issuer
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: konflux-issuer
  namespace: cert-manager
spec:
  ca:
    secretName: konflux-ca-secret
