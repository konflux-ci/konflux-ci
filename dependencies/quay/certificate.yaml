---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: quay-cert
  namespace: quay
spec:
  isCA: true
  subject:
    organizations:
      - konflux
  dnsNames:
    - localhost
    - quay-service.quay
    - quay-service.quay.svc.cluster.local
  # Pinned below konflux-ca renewBefore (4380h); ca.crt is not refreshed when the CA renews.
  duration: 2160h
  renewBefore: 720h
  issuerRef:
    kind: ClusterIssuer
    name: konflux-issuer
  secretName: quay-tls
