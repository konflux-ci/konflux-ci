name: Operator E2E Tests
# Distinct run name for /allow so pr-comment-commands can single-flight per PR
# (same-repo pull_request/merge_group keep the default workflow name).
# Avoid format('{0}') — the } in {0} terminates ${{ }} for the expression lexer.
# Quote the value so YAML does not treat # in "PR #" as a comment.
run-name: "${{ github.workflow }}${{ github.event_name == 'repository_dispatch' && ' /allow PR #' || '' }}${{ github.event_name == 'repository_dispatch' && github.event.client_payload.pr_number || '' }}"

on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
    types: [checks_requested]
  repository_dispatch:
    types: [e2e]

jobs:
  # Gate: fork PRs (inline, before checkout) and companion skip labels (script; opt out: force-run-e2e).
  check-prerequisites:
    runs-on: ubuntu-latest
    outputs:
      run_e2e: ${{ steps.e2e-gate.outputs.run_e2e }}
    steps:
      # Inline so fork PRs cannot replace checked-out script content (see renovate-manifest-companion.yaml).
      - name: Check E2E authorization
        id: e2e-gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          head_repo="$(jq -r '.pull_request.head.repo.full_name // ""' "${GITHUB_EVENT_PATH}")"
          if [[ "${EVENT_NAME}" == "pull_request" && "${head_repo}" != "${REPOSITORY}" ]]; then
            echo "run_e2e=false" >>"${GITHUB_OUTPUT}"
            echo "::warning title=Fork PR E2E authorization required::Comment /allow <commit-sha> to trigger tests."
            {
              echo "### Fork PR"
              echo ""
              echo "Tests are not run automatically from forks."
              echo "**Action Required:** A maintainer must comment \`/allow <commit-sha>\` on this PR to trigger tests."
            } >>"${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          echo "run_e2e=true" >>"${GITHUB_OUTPUT}"

      - name: Checkout
        if: steps.e2e-gate.outputs.run_e2e == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Check companion PR prerequisites
        if: steps.e2e-gate.outputs.run_e2e == 'true'
        env:
          PR_LABELS_JSON: ${{ toJson(github.event.pull_request.labels) }}
        run: bash .github/scripts/check-operator-e2e-prerequisites.sh

  check-changes:
    name: Check for relevant changes
    runs-on: ubuntu-slim
    needs: [check-prerequisites]
    if: needs.check-prerequisites.outputs.run_e2e == 'true'
    permissions:
      contents: read
      checks: write
    outputs:
      operator: ${{ steps.changed-files.outputs.any_changed }}
      check_run_id: ${{ steps.resolve-checks.outputs.check_run_id }}
      check_run_id_arm64: ${{ steps.resolve-checks.outputs.check_run_id_arm64 }}
    steps:
      - name: Set checkout ref
        id: set-ref
        run: |
          case "${{ github.event_name }}" in
            repository_dispatch) ref=$(jq -r '.client_payload.head_sha' "${GITHUB_EVENT_PATH}") ;;
            merge_group)        ref=$(jq -r '.merge_group.head_sha' "${GITHUB_EVENT_PATH}") ;;
            *)                  ref=$(jq -r '.pull_request.head.sha' "${GITHUB_EVENT_PATH}") ;;
          esac
          echo "ref=$ref" >>"${GITHUB_OUTPUT}"
          echo "Trigger: ${{ github.event_name }} → checkout ref: $ref"
      # /allow must update the pull_request workflow's check runs. checks.create with
      # GITHUB_TOKEN attaches to the oldest Actions suite on the SHA (often fullsend's
      # pull_request_target), which does not clear the required Expected contexts.
      - name: Resolve PR check runs (comment-triggered)
        if: github.event_name == 'repository_dispatch'
        id: resolve-checks
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
        with:
          script: |
            const head_sha = '${{ steps.set-ref.outputs.ref }}';
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Look up only — do not mutate until both arches resolve (avoids stranded in_progress).
            async function findCheckRun(name) {
              const { data } = await github.rest.checks.listForRef({
                owner,
                repo,
                ref: head_sha,
                check_name: name,
                filter: 'latest',
                per_page: 100,
              });
              let runs = data.check_runs || [];
              const actionsRuns = runs.filter((r) => r.app?.slug === 'github-actions');
              if (actionsRuns.length > 0) runs = actionsRuns;
              if (runs.length === 0) {
                throw new Error(
                  `No existing check run named "${name}" on ${head_sha}. ` +
                  'Push or re-open the PR so Operator E2E posts the required checks, then /allow again.'
                );
              }
              // Newest by started_at — not "any historical failure" (avoids obsolete retries).
              const preferred = [...runs].sort(
                (a, b) => Date.parse(b.started_at || 0) - Date.parse(a.started_at || 0)
              )[0];
              return preferred.id;
            }

            async function setInProgress(check_run_id) {
              await github.rest.checks.update({
                owner,
                repo,
                check_run_id,
                status: 'in_progress',
              });
            }

            const amdId = await findCheckRun('Run Operator E2E Tests (AMD64)');
            const armId = await findCheckRun('Run Operator E2E Tests (ARM64)');
            await setInProgress(amdId);
            await setInProgress(armId);
            core.setOutput('check_run_id', amdId);
            core.setOutput('check_run_id_arm64', armId);
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ steps.set-ref.outputs.ref }}
          fetch-depth: 0
      - name: Check for changes
        uses: tj-actions/changed-files@24d32ffd492484c1d75e0c0b894501ddb9d30d62  # v47
        id: changed-files
        with:
          files: |
            operator/**
            dependencies/**
            test/e2e/**
            test/go-tests/**
            kind-config.yaml
            generate-err-logs.sh
            .github/workflows/operator-test-e2e.yaml
            .github/workflows/operator-e2e-run.yaml

  # Per-arch workers (not the required status-check names). Split so report-e2e-* can
  # mirror each arch independently. Required names are posted by report-e2e-* below.
  test-skip-amd64:
    name: Operator E2E skip (amd64)
    runs-on: ubuntu-slim
    needs: [check-prerequisites, check-changes]
    if: needs.check-prerequisites.outputs.run_e2e == 'true' && needs.check-changes.outputs.operator != 'true'
    steps:
      - name: Skip test - no operator changes
        run: |
          echo "No operator-related changes detected. Skipping tests."
          echo "This check passes when there are no operator changes to test."

  test-skip-arm64:
    name: Operator E2E skip (arm64)
    runs-on: ubuntu-slim
    needs: [check-prerequisites, check-changes]
    if: needs.check-prerequisites.outputs.run_e2e == 'true' && needs.check-changes.outputs.operator != 'true'
    steps:
      - name: Skip test - no operator changes
        run: |
          echo "No operator-related changes detected. Skipping tests."
          echo "This check passes when there are no operator changes to test."

  test-amd64:
    name: Operator E2E (amd64)
    needs: [check-prerequisites, check-changes]
    if: needs.check-prerequisites.outputs.run_e2e == 'true' && needs.check-changes.outputs.operator == 'true'
    uses: ./.github/workflows/operator-e2e-run.yaml
    secrets: inherit
    with:
      arch: amd64
      runner: ubuntu-latest
      kind_binary: kind-linux-amd64
      kubectl_arch: amd64
      image_suffix: ""
      cluster_suffix: ""
      test_scope: integration+e2e
      konflux_cr: operator/config/samples/konflux-e2e.yaml
      github_app_id_secret: APP_ID_AMD64
      github_private_key_secret: APP_PRIVATE_KEY_AMD64
      webhook_secret_name: APP_WEBHOOK_SECRET_AMD64
      smee_channel_secret: SMEE_CHANNEL_AMD64

  test-arm64:
    name: Operator E2E (arm64)
    needs: [check-prerequisites, check-changes]
    if: needs.check-prerequisites.outputs.run_e2e == 'true' && needs.check-changes.outputs.operator == 'true'
    uses: ./.github/workflows/operator-e2e-run.yaml
    secrets: inherit
    with:
      arch: arm64
      runner: ubuntu-24.04-arm
      kind_binary: kind-linux-arm64
      kubectl_arch: arm64
      image_suffix: "-arm64"
      cluster_suffix: "-arm"
      test_scope: integration+e2e
      konflux_cr: operator/config/samples/konflux-e2e.yaml
      github_app_id_secret: APP_ID_ARM64
      github_private_key_secret: APP_PRIVATE_KEY_ARM64
      webhook_secret_name: APP_WEBHOOK_SECRET_ARM64
      smee_channel_secret: SMEE_CHANNEL_ARM64

  # Required status-check names. Always run (never job-skipped) so branch protection
  # never stays on Expected — including when check-prerequisites fails (companion labels).
  # Forks fail until /allow updates these check runs in place.
  # Each reporter mirrors only its arch so AMD/ARM stay independently visible.
  report-e2e-amd64:
    name: Run Operator E2E Tests (AMD64)
    runs-on: ubuntu-slim
    needs: [check-prerequisites, check-changes, test-skip-amd64, test-amd64]
    if: always() && !cancelled()
    steps:
      - name: Gate / mirror AMD64 result
        env:
          PREREQ: ${{ needs.check-prerequisites.result }}
          RUN_E2E: ${{ needs.check-prerequisites.outputs.run_e2e }}
          OPERATOR: ${{ needs.check-changes.outputs.operator }}
          TEST: ${{ needs.test-amd64.result }}
          TEST_SKIP: ${{ needs.test-skip-amd64.result }}
        run: |
          set -euo pipefail
          if [[ "${PREREQ}" != "success" ]]; then
            echo "::error::check-prerequisites did not succeed (result=${PREREQ})."
            exit 1
          fi
          if [[ "${RUN_E2E}" != "true" ]]; then
            echo "::error::Fork PR: E2E is not authorized. A maintainer must comment \`/allow <commit-sha>\`."
            exit 1
          fi
          # On repository_dispatch these job checks land on main; report-operator-e2e-status
          # updates the pull_request check runs on the PR head SHA.
          if [[ "${OPERATOR}" == "true" ]]; then
            if [[ "${TEST}" == "success" ]]; then
              echo "Operator E2E (AMD64) passed."
              exit 0
            fi
            echo "::error::Operator E2E (AMD64) did not succeed (result=${TEST})."
            exit 1
          fi
          if [[ "${TEST_SKIP}" == "success" ]]; then
            echo "No operator-related changes; E2E skipped."
            exit 0
          fi
          echo "::error::Skip job did not succeed (result=${TEST_SKIP})."
          exit 1

  report-e2e-arm64:
    name: Run Operator E2E Tests (ARM64)
    runs-on: ubuntu-slim
    needs: [check-prerequisites, check-changes, test-skip-arm64, test-arm64]
    if: always() && !cancelled()
    steps:
      - name: Gate / mirror ARM64 result
        env:
          PREREQ: ${{ needs.check-prerequisites.result }}
          RUN_E2E: ${{ needs.check-prerequisites.outputs.run_e2e }}
          OPERATOR: ${{ needs.check-changes.outputs.operator }}
          TEST: ${{ needs.test-arm64.result }}
          TEST_SKIP: ${{ needs.test-skip-arm64.result }}
        run: |
          set -euo pipefail
          if [[ "${PREREQ}" != "success" ]]; then
            echo "::error::check-prerequisites did not succeed (result=${PREREQ})."
            exit 1
          fi
          if [[ "${RUN_E2E}" != "true" ]]; then
            echo "::error::Fork PR: E2E is not authorized. A maintainer must comment \`/allow <commit-sha>\`."
            exit 1
          fi
          if [[ "${OPERATOR}" == "true" ]]; then
            if [[ "${TEST}" == "success" ]]; then
              echo "Operator E2E (ARM64) passed."
              exit 0
            fi
            echo "::error::Operator E2E (ARM64) did not succeed (result=${TEST})."
            exit 1
          fi
          if [[ "${TEST_SKIP}" == "success" ]]; then
            echo "No operator-related changes; E2E skipped."
            exit 0
          fi
          echo "::error::Skip job did not succeed (result=${TEST_SKIP})."
          exit 1

  # Finalize the pull_request check runs when triggered by /allow (same check_run ids, same suite).
  #
  # Known residual race (accepted): workers use cancel-in-progress per PR/arch, but this
  # finalizer does not. If a second repository_dispatch for the same SHA somehow runs
  # (Actions UI re-run, or a slip past single-flight in pr-comment-commands), the older
  # run's finalizer can still write cancelled/failure to the shared check-run IDs after a
  # newer run has set them in_progress or succeeded. Scope: same commit SHA + required
  # check names. Mitigations: per-PR /allow single-flight (normal path); no ownership
  # token on finalize yet.
  report-operator-e2e-status:
    if: always() && needs.check-changes.outputs.check_run_id != ''
    needs: [check-changes, test-skip-amd64, test-skip-arm64, test-amd64, test-arm64]
    runs-on: ubuntu-latest
    permissions:
      checks: write
    steps:
      - name: Update check runs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
        with:
          script: |
            function conclusion(testResult, testSkipResult) {
              if (testResult === 'success' || testSkipResult === 'success') return 'success';
              if (testResult === 'cancelled' || testSkipResult === 'cancelled') return 'cancelled';
              return 'failure';
            }
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const amd64 = conclusion(process.env.TEST_AMD64, process.env.SKIP_AMD64);
            const arm64 = conclusion(process.env.TEST_ARM64, process.env.SKIP_ARM64);
            await github.rest.checks.update({
              owner, repo,
              check_run_id: parseInt(process.env.CHECK_RUN_ID),
              status: 'completed',
              conclusion: amd64,
            });
            await github.rest.checks.update({
              owner, repo,
              check_run_id: parseInt(process.env.CHECK_RUN_ID_ARM64),
              status: 'completed',
              conclusion: arm64,
            });
        env:
          CHECK_RUN_ID: ${{ needs.check-changes.outputs.check_run_id }}
          CHECK_RUN_ID_ARM64: ${{ needs.check-changes.outputs.check_run_id_arm64 }}
          TEST_AMD64: ${{ needs.test-amd64.result }}
          TEST_ARM64: ${{ needs.test-arm64.result }}
          SKIP_AMD64: ${{ needs.test-skip-amd64.result }}
          SKIP_ARM64: ${{ needs.test-skip-arm64.result }}
