name: Operator E2E Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
    types: [checks_requested]
  repository_dispatch:
    types: [e2e]

jobs:
  # Gate: fork PRs (inline, before checkout) and companion skip labels (script; opt out: force-run-e2e).
  check-prerequisites:
    runs-on: ubuntu-latest
    steps:
      # Inline so fork PRs cannot replace checked-out script content (see renovate-manifest-companion.yaml).
      - name: Reject fork PRs
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository
        run: |
          set -euo pipefail
          echo "❌ Fork PR: heavy jobs do not run on push (no secrets). Comment /allow to trigger tests." >&2
          {
            echo "### Fork PR"
            echo ""
            echo "Tests are not run automatically from forks."
            echo "**Action Required:** A maintainer must comment \`/allow\` on this PR to trigger tests."
          } >>"${GITHUB_STEP_SUMMARY}"
          exit 1

      - name: Checkout
        uses: actions/checkout@v7

      - name: Check companion PR prerequisites
        env:
          PR_LABELS_JSON: ${{ toJson(github.event.pull_request.labels) }}
        run: bash .github/scripts/check-operator-e2e-prerequisites.sh

  check-changes:
    name: Check for relevant changes
    runs-on: ubuntu-slim
    needs: [check-prerequisites]
    permissions:
      contents: read
      checks: write
    outputs:
      operator: ${{ steps.changed-files.outputs.any_changed }}
      check_run_id: ${{ steps.create-check.outputs.check_run_id }}
      check_run_id_arm64: ${{ steps.create-check.outputs.check_run_id_arm64 }}
      check_run_id_k3s_amd64: ${{ steps.create-check.outputs.check_run_id_k3s_amd64 }}
      check_run_id_k3s_arm64: ${{ steps.create-check.outputs.check_run_id_k3s_arm64 }}
    steps:
      - name: Set checkout ref
        id: set-ref
        run: |
          case "${{ github.event_name }}" in
            repository_dispatch) ref=$(jq -r '.client_payload.head_sha' $GITHUB_EVENT_PATH) ;;
            merge_group)        ref=$(jq -r '.merge_group.head_sha' $GITHUB_EVENT_PATH) ;;
            *)                  ref=$(jq -r '.pull_request.head.sha' $GITHUB_EVENT_PATH) ;;
          esac
          echo "ref=$ref" >> $GITHUB_OUTPUT
          echo "Trigger: ${{ github.event_name }} → checkout ref: $ref"
      - name: Create check run (comment-triggered)
        if: github.event_name == 'repository_dispatch'
        id: create-check
        uses: actions/github-script@v9
        with:
          script: |
            const head_sha = '${{ steps.set-ref.outputs.ref }}';
            const checks = [
              'Run Operator E2E Tests (AMD64)',
              'Run Operator E2E Tests (ARM64)',
              'Run Operator E2E Tests (k3s AMD64)',
              'Run Operator E2E Tests (k3s ARM64)',
            ];
            const ids = {};
            for (const name of checks) {
              const { data } = await github.rest.checks.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name,
                head_sha,
                status: 'in_progress'
              });
              ids[name] = data.id;
            }
            core.setOutput('check_run_id', ids['Run Operator E2E Tests (AMD64)']);
            core.setOutput('check_run_id_arm64', ids['Run Operator E2E Tests (ARM64)']);
            core.setOutput('check_run_id_k3s_amd64', ids['Run Operator E2E Tests (k3s AMD64)']);
            core.setOutput('check_run_id_k3s_arm64', ids['Run Operator E2E Tests (k3s ARM64)']);
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.set-ref.outputs.ref }}
          fetch-depth: 0
      - name: Check for changes
        uses: tj-actions/changed-files@v47
        id: changed-files
        with:
          files: |
            operator/**
            dependencies/**
            test/e2e/**
            test/go-tests/**
            kind-config.yaml
            scripts/deploy-local.sh
            scripts/setup-kind-local-cluster.sh
            scripts/setup-k3s-local-cluster.sh
            scripts/publish-kind-compatible-host-ports.sh
            scripts/diagnose-nested-unshare.sh
            docs/local-k3s.md
            generate-err-logs.sh
            .github/workflows/operator-test-e2e.yaml

  # Lightweight jobs that create status checks when tests are skipped
  # These use the same matrix structure and job names as the test jobs to ensure
  # status checks are always created. Since the 'if' conditions are mutually exclusive,
  # only one of test-skip or test will run, so there's no conflict with duplicate status check names.
  test-skip:
    name: ${{ matrix.job_name }}
    runs-on: ubuntu-slim
    needs: [check-prerequisites, check-changes]
    if: needs.check-changes.outputs.operator != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            backend: kind
            runner: ubuntu-latest
            kind_binary: kind-linux-amd64
            kubectl_arch: amd64
            image_suffix: ""
            cluster_suffix: ""
            test_scope: "integration+e2e"
            konflux_cr: "operator/config/samples/konflux-e2e.yaml"
            job_name: "Run Operator E2E Tests (AMD64)"
            github_app_id: APP_ID_AMD64
            github_private_key: APP_PRIVATE_KEY_AMD64
            webhook_secret: APP_WEBHOOK_SECRET_AMD64
            smee_channel: SMEE_CHANNEL_AMD64
          - arch: arm64
            backend: kind
            runner: ubuntu-24.04-arm
            kind_binary: kind-linux-arm64
            kubectl_arch: arm64
            image_suffix: "-arm64"
            cluster_suffix: "-arm"
            test_scope: "integration+e2e"
            konflux_cr: "operator/config/samples/konflux-e2e.yaml"
            job_name: "Run Operator E2E Tests (ARM64)"
            github_app_id: APP_ID_ARM64
            github_private_key: APP_PRIVATE_KEY_ARM64
            webhook_secret: APP_WEBHOOK_SECRET_ARM64
            smee_channel: SMEE_CHANNEL_ARM64
          - arch: amd64
            backend: k3s
            runner: ubuntu-latest
            kind_binary: kind-linux-amd64
            kubectl_arch: amd64
            image_suffix: "-k3s"
            cluster_suffix: "-k3s"
            test_scope: "integration+e2e"
            konflux_cr: "operator/config/samples/konflux-e2e.yaml"
            job_name: "Run Operator E2E Tests (k3s AMD64)"
            github_app_id: APP_ID_AMD64
            github_private_key: APP_PRIVATE_KEY_AMD64
            webhook_secret: APP_WEBHOOK_SECRET_AMD64
            smee_channel: SMEE_CHANNEL_AMD64
          - arch: arm64
            backend: k3s
            runner: ubuntu-24.04-arm
            kind_binary: kind-linux-arm64
            kubectl_arch: arm64
            image_suffix: "-k3s-arm64"
            cluster_suffix: "-k3s-arm"
            test_scope: "integration+e2e"
            konflux_cr: "operator/config/samples/konflux-e2e.yaml"
            job_name: "Run Operator E2E Tests (k3s ARM64)"
            github_app_id: APP_ID_ARM64
            github_private_key: APP_PRIVATE_KEY_ARM64
            webhook_secret: APP_WEBHOOK_SECRET_ARM64
            smee_channel: SMEE_CHANNEL_ARM64
    steps:
      - name: Skip test - no operator changes
        run: |
          echo "No operator-related changes detected. Skipping tests."
          echo "This check passes when there are no operator changes to test."

  test:
    name: ${{ matrix.job_name }}
    runs-on: ${{ matrix.runner }}
    needs: [check-prerequisites, check-changes]
    if: needs.check-changes.outputs.operator == 'true'
    # Cancel superseded test jobs per PR/arch/backend to reduce shared smee contention (#6551).
    # Job-level (not workflow-level) so report-operator-e2e-status can finalize /allow
    # Checks API runs when a superseded run's test job is cancelled.
    # Group key (first match wins): pull_request.number, client_payload.pr_number,
    # ref (merge queue), run_id; matrix.arch+backend keeps Kind/k3s and AMD64/ARM64
    # from cancelling each other.
    concurrency:
      group: >-
        operator-e2e-${{
          github.event.pull_request.number
          || github.event.client_payload.pr_number
          || github.ref
          || github.run_id
        }}-${{ matrix.arch }}-${{ matrix.backend }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            backend: kind
            runner: ubuntu-latest
            kind_binary: kind-linux-amd64
            kubectl_arch: amd64
            image_suffix: ""
            cluster_suffix: ""
            test_scope: "integration+e2e"
            konflux_cr: "operator/config/samples/konflux-e2e.yaml"
            job_name: "Run Operator E2E Tests (AMD64)"
            github_app_id: APP_ID_AMD64
            github_private_key: APP_PRIVATE_KEY_AMD64
            webhook_secret: APP_WEBHOOK_SECRET_AMD64
            smee_channel: SMEE_CHANNEL_AMD64
          - arch: arm64
            backend: kind
            runner: ubuntu-24.04-arm
            kind_binary: kind-linux-arm64
            kubectl_arch: arm64
            image_suffix: "-arm64"
            cluster_suffix: "-arm"
            test_scope: "integration+e2e"
            konflux_cr: "operator/config/samples/konflux-e2e.yaml"
            job_name: "Run Operator E2E Tests (ARM64)"
            github_app_id: APP_ID_ARM64
            github_private_key: APP_PRIVATE_KEY_ARM64
            webhook_secret: APP_WEBHOOK_SECRET_ARM64
            smee_channel: SMEE_CHANNEL_ARM64
          - arch: amd64
            backend: k3s
            runner: ubuntu-latest
            kind_binary: kind-linux-amd64
            kubectl_arch: amd64
            image_suffix: "-k3s"
            cluster_suffix: "-k3s"
            test_scope: "integration+e2e"
            konflux_cr: "operator/config/samples/konflux-e2e.yaml"
            job_name: "Run Operator E2E Tests (k3s AMD64)"
            github_app_id: APP_ID_AMD64
            github_private_key: APP_PRIVATE_KEY_AMD64
            webhook_secret: APP_WEBHOOK_SECRET_AMD64
            smee_channel: SMEE_CHANNEL_AMD64
          - arch: arm64
            backend: k3s
            runner: ubuntu-24.04-arm
            kind_binary: kind-linux-arm64
            kubectl_arch: arm64
            image_suffix: "-k3s-arm64"
            cluster_suffix: "-k3s-arm"
            test_scope: "integration+e2e"
            konflux_cr: "operator/config/samples/konflux-e2e.yaml"
            job_name: "Run Operator E2E Tests (k3s ARM64)"
            github_app_id: APP_ID_ARM64
            github_private_key: APP_PRIVATE_KEY_ARM64
            webhook_secret: APP_WEBHOOK_SECRET_ARM64
            smee_channel: SMEE_CHANNEL_ARM64
    env:
      # renovate: datasource=github-releases depName=kubernetes-sigs/kind
      KIND_VERSION: "0.32.0"
      # renovate: datasource=github-releases depName=kubernetes/kubernetes
      KUBECTL_VERSION: "1.36.2"
      # Optional pin for k3s (empty = channel stable from get.k3s.io)
      K3S_VERSION: ""
      OPERATOR_IMAGE: example.com/konflux-operator:v0.0.1${{ matrix.image_suffix }}
      KIND_CLUSTER: konflux-operator-test-e2e${{ matrix.cluster_suffix }}
      CLUSTER_BACKEND: ${{ matrix.backend }}
    defaults:
      run:
        working-directory: operator
    steps:
      - name: Set checkout ref
        id: set-ref
        working-directory: ${{ github.workspace }}
        run: |
          case "${{ github.event_name }}" in
            repository_dispatch) ref=$(jq -r '.client_payload.head_sha' $GITHUB_EVENT_PATH) ;;
            merge_group)        ref=$(jq -r '.merge_group.head_sha' $GITHUB_EVENT_PATH) ;;
            *)                  ref=$(jq -r '.pull_request.head.sha' $GITHUB_EVENT_PATH) ;;
          esac
          echo "ref=$ref" >> $GITHUB_OUTPUT
          echo "Trigger: ${{ github.event_name }} → checkout ref: $ref"
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          docker-images: false

      - name: Clone the code
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.set-ref.outputs.ref }}

      - name: Relax AppArmor userns sysctls (Ubuntu)
        # works around Ubuntu 24.04 restricting unprivileged user namespaces.
        # Do not aa-teardown / disable host AppArmor: that breaks Docker/BuildKit
        # (operator image build). Nested-build diagnostics live in a later k3s step.
        working-directory: ${{ github.workspace }}
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_unconfined=0 || true

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: operator/go.mod
          cache-dependency-path: operator/go.sum

      - name: Install kind (${{ matrix.arch }})
        if: matrix.backend == 'kind'
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v${KIND_VERSION}/${{ matrix.kind_binary }}
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Install kubectl (${{ matrix.arch }})
        run: |
          curl -LO "https://dl.k8s.io/release/v${KUBECTL_VERSION}/bin/linux/${{ matrix.kubectl_arch }}/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl

      - name: Verify kind installation
        if: matrix.backend == 'kind'
        run: kind version

      - name: Deploy Konflux using deploy-local.sh
        working-directory: ${{ github.workspace }}
        env:
          # Cluster configuration
          CLUSTER_BACKEND: ${{ matrix.backend }}
          KIND_CLUSTER: ${{ env.KIND_CLUSTER }}
          K3S_VERSION: ${{ env.K3S_VERSION }}
          # GHA Ubuntu has no firewalld; skip even if present
          K3S_CONFIGURE_FIREWALL: "0"
          OPERATOR_INSTALL_METHOD: "build"
          OPERATOR_IMAGE: ${{ env.OPERATOR_IMAGE }}

          # Kyverno: default pipeline checks on; true mutates PR builds to skip-checks (flaky on GHA).
          # SET_SKIP_CHECKS: "true"

          KONFLUX_CR: ${{ matrix.konflux_cr }}

          # GitHub App secrets (secret names in matrix; one set per row to avoid shared rate limits)
          GITHUB_PRIVATE_KEY: ${{ secrets[matrix.github_private_key] }}
          GITHUB_APP_ID: ${{ secrets[matrix.github_app_id] }}
          WEBHOOK_SECRET: ${{ secrets[matrix.webhook_secret] }}

          # Quay secrets for image-controller (required by konflux-e2e.yaml CR)
          QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
          QUAY_ORGANIZATION: ${{ secrets.QUAY_ORG }}

          # Smee webhook forwarding for E2E tests only (one channel per matrix row)
          SMEE_CHANNEL: ${{ matrix.test_scope == 'integration+e2e' && secrets[matrix.smee_channel] || '' }}

          SKIP_PROMETHEUS_OPERATOR_CRDS: "false"
        run: ./scripts/deploy-local.sh

      - name: Show version information
        working-directory: operator
        run: |
          kubectl version
          if [[ "${{ matrix.backend }}" == "kind" ]]; then
            kind version
          else
            k3s --version || true
          fi

      - name: List namespaces
        run: |
          kubectl get namespace

      - name: Diagnose nested unshare (k3s)
        if: matrix.backend == 'k3s'
        working-directory: ${{ github.workspace }}
        run: |
          chmod +x scripts/diagnose-nested-unshare.sh
          ./scripts/diagnose-nested-unshare.sh

      - name: Run go-tests pkg unit tests
        working-directory: ${{ github.workspace }}
        run: |
          cd test/go-tests
          go test ./pkg/...

      - name: Set build pipeline bundle (min)
        if: matrix.test_scope == 'integration+e2e'
        working-directory: ${{ github.workspace }}
        run: |
          BUNDLE=$(yq eval-all 'select(.kind == "ConfigMap" and .metadata.name == "build-pipeline-config") | .data["config.yaml"]' operator/pkg/manifests/build-service/manifests.yaml | yq eval '.pipelines[] | select(.name == "docker-build-oci-ta-min") | .bundle' -)
          echo "CUSTOM_DOCKER_BUILD_OCI_TA_MIN_PIPELINE_BUNDLE=$BUNDLE" >> $GITHUB_ENV

      - name: Run E2E tests
        if: matrix.test_scope == 'integration+e2e'
        working-directory: ${{ github.workspace }}
        env:
          GH_ORG: ${{ secrets.GH_ORG }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          # Test framework reads GITHUB_TOKEN and MY_GITHUB_ORG (see pkg/clients/common/controller.go, e2e.env.template)
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          MY_GITHUB_ORG: ${{ secrets.GH_ORG }}
          E2E_APPLICATIONS_NAMESPACE: default-tenant
          E2E_DEPLOY_TEST_RESOURCES: "true"
        run: |
          ./test/e2e/run-e2e.sh \
            -ginkgo.github-output \
            -ginkgo.junit-report=${{ github.workspace }}/junit-conformance-${{ matrix.arch }}-${{ matrix.backend }}.xml

      - name: Generate error logs
        if: ${{ !cancelled() }}
        working-directory: ${{ github.workspace }}
        run: |
          echo "Konflux CR:"
          kubectl get konflux konflux -o yaml || :
          ./generate-err-logs.sh

      - name: Collect JUnit report
        if: ${{ !cancelled() }}
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p logs/junit
          cp junit-conformance-${{ matrix.arch }}-${{ matrix.backend }}.xml logs/junit/ 2>/dev/null || true

      - name: Archive logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ matrix.arch }}-${{ matrix.backend }}
          path: logs

  # Report check result to PR when triggered by /allow (so the run appears on the PR and can gate it)
  report-operator-e2e-status:
    if: always() && needs.check-changes.outputs.check_run_id != ''
    needs: [check-changes, test-skip, test]
    runs-on: ubuntu-latest
    permissions:
      checks: write
    steps:
      - name: Update check runs
        uses: actions/github-script@v9
        with:
          script: |
            const ids = [
              process.env.CHECK_RUN_ID,
              process.env.CHECK_RUN_ID_ARM64,
              process.env.CHECK_RUN_ID_K3S_AMD64,
              process.env.CHECK_RUN_ID_K3S_ARM64,
            ].map((v) => parseInt(v, 10)).filter((n) => Number.isFinite(n));
            const testResult = process.env.TEST_RESULT;
            const testSkipResult = process.env.TEST_SKIP_RESULT;
            let conclusion = 'failure';
            if (testResult === 'success' || testSkipResult === 'success') conclusion = 'success';
            else if (testResult === 'cancelled' || testSkipResult === 'cancelled') conclusion = 'cancelled';
            const update = { owner: context.repo.owner, repo: context.repo.repo, status: 'completed', conclusion };
            for (const check_run_id of ids) {
              await github.rest.checks.update({ ...update, check_run_id });
            }
        env:
          CHECK_RUN_ID: ${{ needs.check-changes.outputs.check_run_id }}
          CHECK_RUN_ID_ARM64: ${{ needs.check-changes.outputs.check_run_id_arm64 }}
          CHECK_RUN_ID_K3S_AMD64: ${{ needs.check-changes.outputs.check_run_id_k3s_amd64 }}
          CHECK_RUN_ID_K3S_ARM64: ${{ needs.check-changes.outputs.check_run_id_k3s_arm64 }}
          TEST_RESULT: ${{ needs.test.result }}
          TEST_SKIP_RESULT: ${{ needs.test-skip.result }}
