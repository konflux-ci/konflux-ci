name: Operator E2E Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
    types: [checks_requested]
  repository_dispatch:
    types: [e2e]

jobs:
  # Gate: fork PRs (inline, before checkout) and companion skip labels (script; opt out: force-run-e2e).
  check-prerequisites:
    runs-on: ubuntu-latest
    outputs:
      run_e2e: ${{ steps.e2e-gate.outputs.run_e2e }}
    steps:
      # Inline so fork PRs cannot replace checked-out script content (see renovate-manifest-companion.yaml).
      - name: Check E2E authorization
        id: e2e-gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          head_repo="$(jq -r '.pull_request.head.repo.full_name // ""' "${GITHUB_EVENT_PATH}")"
          if [[ "${EVENT_NAME}" == "pull_request" && "${head_repo}" != "${REPOSITORY}" ]]; then
            echo "run_e2e=false" >>"${GITHUB_OUTPUT}"
            echo "::warning title=Fork PR E2E authorization required::Comment /allow <commit-sha> to trigger tests."
            {
              echo "### Fork PR"
              echo ""
              echo "Tests are not run automatically from forks."
              echo "**Action Required:** A maintainer must comment \`/allow <commit-sha>\` on this PR to trigger tests."
            } >>"${GITHUB_STEP_SUMMARY}"
            # Diagnostics stay in the step log (not the job summary fork authors see).
            echo "e2e-diag event=${EVENT_NAME} run_e2e=false run_id=${GITHUB_RUN_ID} github_sha=${GITHUB_SHA} job=${GITHUB_JOB}"
            echo "e2e-diag test/test-skip will be skipped; GitHub often records those skipped jobs as name=matrix.job_name instead of Run Operator E2E Tests (AMD64|ARM64)."
            exit 0
          fi

          echo "run_e2e=true" >>"${GITHUB_OUTPUT}"
          echo "e2e-diag event=${EVENT_NAME} run_e2e=true run_id=${GITHUB_RUN_ID} github_sha=${GITHUB_SHA} job=${GITHUB_JOB}"

      - name: Checkout
        if: steps.e2e-gate.outputs.run_e2e == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Check companion PR prerequisites
        if: steps.e2e-gate.outputs.run_e2e == 'true'
        env:
          PR_LABELS_JSON: ${{ toJson(github.event.pull_request.labels) }}
        run: bash .github/scripts/check-operator-e2e-prerequisites.sh

  check-changes:
    name: Check for relevant changes
    runs-on: ubuntu-slim
    needs: [check-prerequisites]
    if: needs.check-prerequisites.outputs.run_e2e == 'true'
    permissions:
      contents: read
      checks: write
      actions: read   # getWorkflowRun.check_suite_id for /allow attachment diagnostics
    outputs:
      operator: ${{ steps.changed-files.outputs.any_changed }}
      check_run_id: ${{ steps.create-check.outputs.check_run_id }}
      check_run_id_arm64: ${{ steps.create-check.outputs.check_run_id_arm64 }}
    steps:
      - name: Set checkout ref
        id: set-ref
        run: |
          case "${{ github.event_name }}" in
            repository_dispatch) ref=$(jq -r '.client_payload.head_sha' $GITHUB_EVENT_PATH) ;;
            merge_group)        ref=$(jq -r '.merge_group.head_sha' $GITHUB_EVENT_PATH) ;;
            *)                  ref=$(jq -r '.pull_request.head.sha' $GITHUB_EVENT_PATH) ;;
          esac
          echo "ref=$ref" >> $GITHUB_OUTPUT
          echo "Trigger: ${{ github.event_name }} → checkout ref: $ref"
          echo "e2e-diag event=${{ github.event_name }} run_id=${{ github.run_id }} ref=$ref"
      - name: Create check run (comment-triggered)
        if: github.event_name == 'repository_dispatch'
        id: create-check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head_sha = '${{ steps.set-ref.outputs.ref }}';
            const names = ['Run Operator E2E Tests (AMD64)', 'Run Operator E2E Tests (ARM64)'];

            const logCheck = (label, c) => {
              const suite = (c.check_suite || {});
              const prs = (c.pull_requests || []).map(p => p.number).join(',') || '(none)';
              core.info(
                `${label} id=${c.id} name=${JSON.stringify(c.name)} status=${c.status}/${c.conclusion} ` +
                `head_sha=${c.head_sha} suite=${suite.id} external_id=${JSON.stringify(c.external_id || '')} ` +
                `prs=[${prs}] html=${c.html_url}`
              );
            };

            // This dispatch run's suite (from Actions API). checks.create often attaches to a
            // different (older) Actions suite on the PR head SHA — that mismatch is the bug.
            let thisRunSuiteId;
            try {
              const { data: thisRun } = await github.rest.actions.getWorkflowRun({
                owner, repo, run_id: context.runId
              });
              thisRunSuiteId = thisRun.check_suite_id;
              core.info(`e2e-diag this_run_id=${thisRun.id} this_run_suite=${thisRunSuiteId} event=${thisRun.event} head_sha=${thisRun.head_sha}`);
            } catch (err) {
              core.warning(`e2e-diag getWorkflowRun failed: ${err.message}`);
            }

            let oldestGhaSuiteId;
            try {
              const { data: suitesData } = await github.rest.checks.listSuitesForRef({
                owner, repo, ref: head_sha, per_page: 100
              });
              const suites = [...(suitesData.check_suites || [])].sort(
                (a, b) => new Date(a.created_at) - new Date(b.created_at)
              );
              if (suitesData.total_count > suites.length) {
                core.warning(
                  `e2e-diag suite inventory incomplete: total_count=${suitesData.total_count} returned=${suites.length}; ` +
                  `oldest_gha_suite may not be the true oldest on this SHA`
                );
              }
              const gha = suites.filter(s => (s.app || {}).slug === 'github-actions');
              oldestGhaSuiteId = gha.length ? gha[0].id : undefined;
              core.info(
                `e2e-diag suites before create: total=${suitesData.total_count} returned=${suites.length} ` +
                `oldest_gha_suite=${oldestGhaSuiteId ?? '(none)'} this_run_suite=${thisRunSuiteId ?? '(unknown)'}`
              );
              for (const s of suites) {
                const app = s.app || {};
                core.info(
                  `e2e-diag suite id=${s.id} created=${s.created_at} app=${app.id}/${app.slug} ` +
                  `status=${s.status}/${s.conclusion} latest_runs=${s.latest_check_runs_count} ` +
                  `head_branch=${s.head_branch}`
                );
              }
            } catch (err) {
              core.warning(`e2e-diag listSuitesForRef failed: ${err.message}`);
            }

            const { data: e2e } = await github.rest.checks.create({
              owner, repo,
              name: names[0],
              head_sha,
              status: 'in_progress'
            });
            const { data: arm64 } = await github.rest.checks.create({
              owner, repo,
              name: names[1],
              head_sha,
              status: 'in_progress'
            });
            // Publish IDs before any logging so a log throw cannot skip
            // report-operator-e2e-status and leave these runs in_progress.
            core.setOutput('check_run_id', e2e.id);
            core.setOutput('check_run_id_arm64', arm64.id);
            try {
              logCheck('e2e-diag created AMD64', e2e);
              logCheck('e2e-diag created ARM64', arm64);
              const createdSuite = (e2e.check_suite || {}).id;
              // Avoid undefined === undefined → true when either side failed to resolve.
              const sameSuite = (a, b) => (a == null || b == null) ? 'unknown' : String(a === b);
              core.info(
                `e2e-diag attachment: created_suite=${createdSuite ?? '(unknown)'} ` +
                `on_this_run_suite=${sameSuite(createdSuite, thisRunSuiteId)} ` +
                `on_oldest_gha_suite=${sameSuite(createdSuite, oldestGhaSuiteId)} ` +
                `this_run_suite=${thisRunSuiteId ?? '(unknown)'} oldest_gha_suite=${oldestGhaSuiteId ?? '(none)'}`
              );
            } catch (err) {
              core.warning(`e2e-diag post-create logging failed: ${err.message}`);
            }

            try {
              for (const name of names) {
                const { data } = await github.rest.checks.listForRef({
                  owner, repo, ref: head_sha, check_name: name, per_page: 100, filter: 'all'
                });
                core.info(`e2e-diag existing '${name}' on SHA: ${data.total_count}`);
                for (const c of data.check_runs || []) logCheck('e2e-diag listed', c);
              }
            } catch (err) {
              core.warning(`e2e-diag listForRef failed: ${err.message}`);
            }
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ steps.set-ref.outputs.ref }}
          fetch-depth: 0
      - name: Check for changes
        uses: tj-actions/changed-files@24d32ffd492484c1d75e0c0b894501ddb9d30d62  # v47
        id: changed-files
        with:
          files: |
            operator/**
            dependencies/**
            test/e2e/**
            test/go-tests/**
            kind-config.yaml
            generate-err-logs.sh
            .github/workflows/operator-test-e2e.yaml

  # Lightweight jobs that create status checks when tests are skipped
  # These use the same matrix structure and job names as the test jobs to ensure
  # status checks are always created. Since the 'if' conditions are mutually exclusive,
  # only one of test-skip or test will run, so there's no conflict with duplicate status check names.
  test-skip:
    name: ${{ matrix.job_name }}
    runs-on: ubuntu-slim
    needs: [check-prerequisites, check-changes]
    if: needs.check-prerequisites.outputs.run_e2e == 'true' && needs.check-changes.outputs.operator != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            kind_binary: kind-linux-amd64
            kubectl_arch: amd64
            image_suffix: ""
            cluster_suffix: ""
            test_scope: "integration+e2e"
            konflux_cr: "operator/config/samples/konflux-e2e.yaml"
            job_name: "Run Operator E2E Tests (AMD64)"
            github_app_id: APP_ID_AMD64
            github_private_key: APP_PRIVATE_KEY_AMD64
            webhook_secret: APP_WEBHOOK_SECRET_AMD64
            smee_channel: SMEE_CHANNEL_AMD64
          - arch: arm64
            runner: ubuntu-24.04-arm
            kind_binary: kind-linux-arm64
            kubectl_arch: arm64
            image_suffix: "-arm64"
            cluster_suffix: "-arm"
            test_scope: "integration+e2e"
            konflux_cr: "operator/config/samples/konflux-e2e.yaml"
            job_name: "Run Operator E2E Tests (ARM64)"
            github_app_id: APP_ID_ARM64
            github_private_key: APP_PRIVATE_KEY_ARM64
            webhook_secret: APP_WEBHOOK_SECRET_ARM64
            smee_channel: SMEE_CHANNEL_ARM64
    steps:
      - name: Log job identity
        run: |
          echo "e2e-diag github.job=${{ github.job }} matrix.job_name=${{ matrix.job_name }} event=${{ github.event_name }} run_id=${{ github.run_id }} arch=${{ matrix.arch }}"
      - name: Skip test - no operator changes
        run: |
          echo "No operator-related changes detected. Skipping tests."
          echo "This check passes when there are no operator changes to test."

  test:
    name: ${{ matrix.job_name }}
    runs-on: ${{ matrix.runner }}
    needs: [check-prerequisites, check-changes]
    if: needs.check-prerequisites.outputs.run_e2e == 'true' && needs.check-changes.outputs.operator == 'true'
    # Cancel superseded test jobs per PR/arch to reduce shared smee contention (#6551).
    # Job-level (not workflow-level) so report-operator-e2e-status can finalize /allow
    # Checks API runs when a superseded run's test job is cancelled.
    # Group key (first match wins): pull_request.number, client_payload.pr_number,
    # ref (merge queue), run_id; matrix.arch keeps AMD64/ARM64 from cancelling each other.
    concurrency:
      group: >-
        operator-e2e-${{
          github.event.pull_request.number
          || github.event.client_payload.pr_number
          || github.ref
          || github.run_id
        }}-${{ matrix.arch }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            kind_binary: kind-linux-amd64
            kubectl_arch: amd64
            image_suffix: ""
            cluster_suffix: ""
            test_scope: "integration+e2e"
            konflux_cr: "operator/config/samples/konflux-e2e.yaml"
            job_name: "Run Operator E2E Tests (AMD64)"
            github_app_id: APP_ID_AMD64
            github_private_key: APP_PRIVATE_KEY_AMD64
            webhook_secret: APP_WEBHOOK_SECRET_AMD64
            smee_channel: SMEE_CHANNEL_AMD64
          - arch: arm64
            runner: ubuntu-24.04-arm
            kind_binary: kind-linux-arm64
            kubectl_arch: arm64
            image_suffix: "-arm64"
            cluster_suffix: "-arm"
            test_scope: "integration+e2e"
            konflux_cr: "operator/config/samples/konflux-e2e.yaml"
            job_name: "Run Operator E2E Tests (ARM64)"
            github_app_id: APP_ID_ARM64
            github_private_key: APP_PRIVATE_KEY_ARM64
            webhook_secret: APP_WEBHOOK_SECRET_ARM64
            smee_channel: SMEE_CHANNEL_ARM64
    env:
      # renovate: datasource=github-releases depName=kubernetes-sigs/kind
      KIND_VERSION: "0.33.0"
      # renovate: datasource=github-releases depName=kubernetes/kubernetes
      KUBECTL_VERSION: "1.37.1"
      OPERATOR_IMAGE: example.com/konflux-operator:v0.0.1${{ matrix.image_suffix }}
      KIND_CLUSTER: konflux-operator-test-e2e${{ matrix.cluster_suffix }}
    defaults:
      run:
        working-directory: operator
    steps:
      - name: Set checkout ref
        id: set-ref
        working-directory: ${{ github.workspace }}
        run: |
          case "${{ github.event_name }}" in
            repository_dispatch) ref=$(jq -r '.client_payload.head_sha' $GITHUB_EVENT_PATH) ;;
            merge_group)        ref=$(jq -r '.merge_group.head_sha' $GITHUB_EVENT_PATH) ;;
            *)                  ref=$(jq -r '.pull_request.head.sha' $GITHUB_EVENT_PATH) ;;
          esac
          echo "ref=$ref" >> $GITHUB_OUTPUT
          echo "Trigger: ${{ github.event_name }} → checkout ref: $ref"
          echo "e2e-diag github.job=${{ github.job }} matrix.job_name=${{ matrix.job_name }} event=${{ github.event_name }} run_id=${{ github.run_id }} arch=${{ matrix.arch }} ref=$ref"
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6  # v2.0.0
        with:
          tool-cache: false
          docker-images: false

      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ steps.set-ref.outputs.ref }}

      - name: Disable AppArmor
        # works around a change in ubuntu 24.04 that restricts Linux namespace access
        # for unprivileged users
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version-file: operator/go.mod
          cache-dependency-path: operator/go.sum

      - name: Install kind (${{ matrix.arch }})
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v${KIND_VERSION}/${{ matrix.kind_binary }}
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Install kubectl (${{ matrix.arch }})
        run: |
          curl -LO "https://dl.k8s.io/release/v${KUBECTL_VERSION}/bin/linux/${{ matrix.kubectl_arch }}/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl

      - name: Verify kind installation
        run: kind version

      - name: Deploy Konflux using deploy-local.sh
        working-directory: ${{ github.workspace }}
        env:
          # Cluster configuration
          KIND_CLUSTER: ${{ env.KIND_CLUSTER }}
          OPERATOR_INSTALL_METHOD: "build"
          OPERATOR_IMAGE: ${{ env.OPERATOR_IMAGE }}

          # MutatingAdmissionPolicy: default pipeline checks on; true mutates PR builds to skip-checks (flaky on GHA).
          # SET_SKIP_CHECKS: "true"

          KONFLUX_CR: ${{ matrix.konflux_cr }}

          # GitHub App secrets (secret names in matrix; one set per row to avoid shared rate limits)
          GITHUB_PRIVATE_KEY: ${{ secrets[matrix.github_private_key] }}
          GITHUB_APP_ID: ${{ secrets[matrix.github_app_id] }}
          WEBHOOK_SECRET: ${{ secrets[matrix.webhook_secret] }}

          # Quay secrets for image-controller (required by konflux-e2e.yaml CR)
          QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
          QUAY_ORGANIZATION: ${{ secrets.QUAY_ORG }}

          # Smee webhook forwarding for E2E tests only (one channel per matrix row)
          SMEE_CHANNEL: ${{ matrix.test_scope == 'integration+e2e' && secrets[matrix.smee_channel] || '' }}

          SKIP_PROMETHEUS_OPERATOR_CRDS: "false"
        run: ./scripts/deploy-local.sh

      - name: Show version information
        working-directory: operator
        run: |
          kubectl version
          kind version

      - name: List namespaces
        run: |
          kubectl get namespace

      - name: Run go-tests pkg unit tests
        working-directory: ${{ github.workspace }}
        run: |
          cd test/go-tests
          go test ./pkg/...

      - name: Set build pipeline bundle (min)
        if: matrix.test_scope == 'integration+e2e'
        working-directory: ${{ github.workspace }}
        run: |
          BUNDLE=$(yq eval-all 'select(.kind == "ConfigMap" and .metadata.name == "build-pipeline-config") | .data["config.yaml"]' operator/pkg/manifests/build-service/manifests.yaml | yq eval '.pipelines[] | select(.name == "docker-build-oci-ta-min") | .bundle' -)
          echo "CUSTOM_DOCKER_BUILD_OCI_TA_MIN_PIPELINE_BUNDLE=$BUNDLE" >> $GITHUB_ENV

      - name: Run E2E tests
        if: matrix.test_scope == 'integration+e2e'
        working-directory: ${{ github.workspace }}
        env:
          GH_ORG: ${{ secrets.GH_ORG }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          # Test framework reads GITHUB_TOKEN and MY_GITHUB_ORG (see pkg/clients/common/controller.go, e2e.env.template)
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          MY_GITHUB_ORG: ${{ secrets.GH_ORG }}
          E2E_APPLICATIONS_NAMESPACE: default-tenant
          E2E_DEPLOY_TEST_RESOURCES: "true"
        run: |
          ./test/e2e/run-e2e.sh \
            -ginkgo.github-output \
            -ginkgo.junit-report=${{ github.workspace }}/junit-conformance-${{ matrix.arch }}.xml

      - name: Generate error logs
        if: ${{ !cancelled() }}
        working-directory: ${{ github.workspace }}
        run: |
          echo "Konflux CR:"
          kubectl get konflux konflux -o yaml || :
          ./generate-err-logs.sh

      - name: Collect JUnit report
        if: ${{ !cancelled() }}
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p logs/junit
          cp junit-conformance-${{ matrix.arch }}.xml logs/junit/ 2>/dev/null || true

      - name: Archive logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: logs-${{ matrix.arch }}
          path: logs

  # Report check result to PR when triggered by /allow (so the run appears on the PR and can gate it)
  report-operator-e2e-status:
    if: always() && needs.check-changes.outputs.check_run_id != ''
    needs: [check-changes, test-skip, test]
    runs-on: ubuntu-latest
    permissions:
      checks: write
      actions: read   # getWorkflowRun.check_suite_id for /allow attachment diagnostics
    steps:
      - name: Update check runs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const checkRunId = parseInt(process.env.CHECK_RUN_ID);
            const checkRunIdArm64 = parseInt(process.env.CHECK_RUN_ID_ARM64);
            const testResult = process.env.TEST_RESULT;
            const testSkipResult = process.env.TEST_SKIP_RESULT;
            let conclusion = 'failure';
            if (testResult === 'success' || testSkipResult === 'success') conclusion = 'success';
            else if (testResult === 'cancelled' || testSkipResult === 'cancelled') conclusion = 'cancelled';

            let thisRunSuiteId;
            try {
              const { data: thisRun } = await github.rest.actions.getWorkflowRun({
                owner, repo, run_id: context.runId
              });
              thisRunSuiteId = thisRun.check_suite_id;
            } catch (err) {
              core.warning(`e2e-diag getWorkflowRun failed: ${err.message}`);
            }
            core.info(
              `e2e-diag finalize test=${testResult} test-skip=${testSkipResult} conclusion=${conclusion} ` +
              `amd64_id=${checkRunId} arm64_id=${checkRunIdArm64} this_run=${context.runId} ` +
              `this_run_suite=${thisRunSuiteId ?? '(unknown)'}`
            );

            const update = { owner, repo, status: 'completed', conclusion };
            const { data: amd } = await github.rest.checks.update({ ...update, check_run_id: checkRunId });
            const { data: arm } = await github.rest.checks.update({ ...update, check_run_id: checkRunIdArm64 });
            try {
              // Avoid undefined === undefined → true when either side failed to resolve.
              const sameSuite = (a, b) => (a == null || b == null) ? 'unknown' : String(a === b);
              for (const [label, c] of [['AMD64', amd], ['ARM64', arm]]) {
                const suite = c.check_suite || {};
                const prs = (c.pull_requests || []).map(p => p.number).join(',') || '(none)';
                core.info(
                  `e2e-diag updated ${label} id=${c.id} name=${JSON.stringify(c.name)} ` +
                  `status=${c.status}/${c.conclusion} suite=${suite.id ?? '(unknown)'} ` +
                  `on_this_run_suite=${sameSuite(suite.id, thisRunSuiteId)} prs=[${prs}] html=${c.html_url}`
                );
              }
            } catch (err) {
              core.warning(`e2e-diag post-update logging failed: ${err.message}`);
            }
        env:
          CHECK_RUN_ID: ${{ needs.check-changes.outputs.check_run_id }}
          CHECK_RUN_ID_ARM64: ${{ needs.check-changes.outputs.check_run_id_arm64 }}
          TEST_RESULT: ${{ needs.test.result }}
          TEST_SKIP_RESULT: ${{ needs.test-skip.result }}
