name: Verify Generated Operator Files

on:
  pull_request:
  merge_group:
    types: [checks_requested]

jobs:
  check-changes:
    name: Check for relevant changes
    runs-on: ubuntu-slim
    outputs:
      operator: ${{ steps.changed-files.outputs.any_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
      - name: Check for changes
        uses: tj-actions/changed-files@24d32ffd492484c1d75e0c0b894501ddb9d30d62  # v47
        id: changed-files
        with:
          files: |
            operator/**
            .github/workflows/operator-verify-generated-files.yml
            .github/scripts/operator-verify-generated-files.sh

  verify-generated:
    name: Verify Generated CRDs, RBAC, and Code
    runs-on: ubuntu-latest
    needs: check-changes
    if: needs.check-changes.outputs.operator == 'true'
    defaults:
      run:
        working-directory: operator

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version-file: operator/go.mod

      - name: Check for changes in generated files
        working-directory: ${{ github.workspace }}
        run: ./.github/scripts/operator-verify-generated-files.sh
