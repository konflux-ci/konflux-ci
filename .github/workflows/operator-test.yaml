name: Operator Tests

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]

jobs:
  check-changes:
    name: Check for relevant changes
    runs-on: ubuntu-slim
    outputs:
      operator: ${{ steps.changed-files.outputs.any_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
      - name: Check for changes
        uses: tj-actions/changed-files@24d32ffd492484c1d75e0c0b894501ddb9d30d62  # v47
        id: changed-files
        with:
          files: |
            operator/**
            test/go-tests/**
            .github/workflows/operator-test.yaml
            .codecov.yml

  test:
    name: Run Operator Tests
    runs-on: ubuntu-latest
    needs: check-changes
    if: needs.check-changes.outputs.operator == 'true'
    permissions:
      id-token: write
    defaults:
      run:
        working-directory: operator
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version-file: operator/go.mod

      - name: Verify go.sum is up to date
        run: go mod tidy -diff

      - name: Running Tests
        run: |
          make test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7
        with:
          use_oidc: true
          flags: unit-tests
          files: operator/cover.out
          fail_ci_if_error: false

