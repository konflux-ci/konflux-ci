name: Community Operator PR

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'GitHub release tag (e.g., v0.0.4)'
        required: true
        type: string

permissions:
  contents: read
  issues: write

jobs:
  create-pr:
    name: Create Community Operator PR
    runs-on: ubuntu-latest
    # Run for both stable and candidate (prerelease) releases; skip only for non-dispatch non-release events
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      # The release tag is untrusted free text: a git tag name may legally contain
      # $(), backticks, ';', '|' and quotes, and workflow_dispatch inputs are
      # unconstrained. Bind both to env vars and reference them as "$VAR" — a
      # template expression inside a run: block is substituted into the script
      # before bash parses it, and the PR step below runs with the bot PAT in
      # scope. The tag format is validated here before it is used.
      - name: Determine release tag
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG_EVENT: ${{ github.event.release.tag_name }}
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          if [ "${EVENT_NAME}" == "release" ]; then
            RELEASE_TAG="${RELEASE_TAG_EVENT}"
          else
            RELEASE_TAG="${RELEASE_TAG_INPUT}"
          fi
          if [[ ! "${RELEASE_TAG}" =~ ^[A-Za-z0-9][A-Za-z0-9._/+-]*$ ]]; then
            echo "Error: release tag contains disallowed characters: '${RELEASE_TAG}'" >&2
            exit 1
          fi
          echo "tag=${RELEASE_TAG}" >> $GITHUB_OUTPUT
          echo "Using release tag: ${RELEASE_TAG}"

      - name: Create Community Operator PR
        env:
          GITHUB_TOKEN: ${{ secrets.KONFLUX_CI_BOT_PAT }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          .github/scripts/create-community-operator-pr.sh "${RELEASE_TAG}" --draft

      - name: Create issue on failure
        if: failure()
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_NAME: Community Operator PR
          RELEASE_VERSION: ${{ steps.release.outputs.tag }}
        run: |
          .github/scripts/create-or-update-issue.sh \
            "Community Operator PR Failure" \
            "Creating the Community Operator PR failed."
