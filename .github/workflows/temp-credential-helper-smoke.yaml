name: TEMP credential helper smoke
on:
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
      - name: Smoke in-memory github.com helper
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016
          git config --local credential.https://github.com.helper \
            '!f() { echo "username=x-access-token"; echo "password=${GH_TOKEN}"; }; f'

          test ! -f ~/.git-credentials

          # Proves the helper supplies creds for github.com HTTPS
          git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" HEAD >/dev/null

          # Prove host scoping: clearing the github.com helper means no token for example.com
          if git -c credential.https://github.com.helper= ls-remote "https://example.com/foo.git" HEAD 2>/dev/null; then
            echo "unexpected success talking to example.com" >&2
            exit 1
          fi

          echo "OK: helper auth works; no ~/.git-credentials written"
