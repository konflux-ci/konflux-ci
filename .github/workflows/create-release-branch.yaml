name: Create Release Branch

on:
  workflow_dispatch:
    inputs:
      dev_version:
        description: 'Next dev version X.Y (e.g. 1.2 → tag v1.2.0-rc.0 on main)'
        required: true
        type: string
      release_version:
        description: 'Release version X.Y (e.g. 1.1)'
        required: true
        type: string
      git_ref:
        description: 'Ref to create branch from (default: head of main)'
        required: false
        type: string
        default: 'main'

permissions:
  contents: write
  pull-requests: write

jobs:
  create-release-branch:
    name: Create Release Branch
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3
        with:
          app-id: ${{ secrets.UPDATE_BOT_APP_ID }}
          private-key: ${{ secrets.UPDATE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: ${{ inputs.git_ref }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

      # workflow_dispatch inputs are untrusted free text. Bind them to env vars and
      # reference them as "$VAR": a template expression inside a run: block is
      # substituted into the script before bash parses it, so a value containing
      # $(), backticks or ';' would execute here with the App token in scope.
      # create-release-branch-and-pr.sh validates their format as a second layer.
      - name: Create release branch
        id: create
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          DEV_VERSION: ${{ inputs.dev_version }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          GIT_REF: ${{ inputs.git_ref }}
        run: |
          .github/scripts/create-release-branch-and-pr.sh \
            "${DEV_VERSION}" \
            "${RELEASE_VERSION}" \
            "${GIT_REF}" \
            "origin"
